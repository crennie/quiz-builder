name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persistence:
    name: Shared contracts and migration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck shared contracts
        run: npm run typecheck:shared

      - name: Check shared formatting
        run: npm run format:check

      - name: Check use-case test mapping
        run: npm run check:use-cases

      - name: Test shared contracts
        run: npm run test:shared

      - name: Build shared contracts
        run: npm run build:shared

      - name: Apply and check SQL migrations
        run: npm run db:check-schema

  frontend:
    name: Frontend validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Browser workflows and generated types
    needs: [persistence, frontend, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install shared dependencies and build contracts
        run: npm ci && npm run build:shared

      - name: Install applications
        run: npm ci --prefix frontend && npm ci --prefix backend

      - name: Install Chromium
        run: npm exec --prefix frontend -- playwright install --with-deps chromium

      - name: Start local Supabase
        run: npx supabase start --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Check generated database types
        run: npm run db:types && git diff --exit-code -- shared/src/database.types.ts

      - name: Run browser workflows
        run: npm run test:e2e --prefix frontend

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: frontend/test-results/
          if-no-files-found: ignore

  backend:
    name: Backend validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: quiz_builder_test
          POSTGRES_USER: quiz_builder
          POSTGRES_PASSWORD: quiz_builder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quiz_builder -d quiz_builder_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install shared dependencies
        run: npm ci --prefix ..

      - name: Build shared contracts
        run: npm run build:shared --prefix ..

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://quiz_builder:quiz_builder@localhost:5432/quiz_builder_test

      - name: Validate OpenAPI document
        run: npm run openapi:check

      - name: Build
        run: npm run build
